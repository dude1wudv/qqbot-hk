_config_version: 12

timezone: Asia/Hong_Kong

gateway:
  group_sessions_per_user: false

model:
  provider: sub2api
  default: deepseek-v4-flash-0731
  api_mode: chat_completions
  context_length: 1000000
  streaming: true

providers:
  sub2api:
    base_url: http://sub2api:8080/v1
    key_env: SUB2API_API_KEY
    api_mode: chat_completions
    discover_models: false
    models:
      deepseek-v4-flash-0731:
        context_length: 1000000
      gemini-3.8-flash-high:
        context_length: 1048576
      gpt-5.6-luna:
        context_length: 330000

fallback_providers:
  - provider: sub2api
    model: gemini-3.8-flash-high
    base_url: http://sub2api:8080/v1
    key_env: SUB2API_API_KEY
    api_mode: chat_completions
  - provider: sub2api
    model: gpt-5.6-luna
    base_url: http://sub2api:8080/v1
    key_env: SUB2API_API_KEY
    api_mode: codex_responses

agent:
  reasoning_effort: medium
  # DeepSeek is text-only. User-attached images are always described by the
  # dedicated auxiliary vision chain before the text reaches the main model.
  image_input_mode: text
  reasoning_overrides:
    deepseek-v4-flash-0731: low
    gemini-3.8-flash-high: high
    gpt-5.6-luna: medium

auxiliary:
  vision:
    provider: custom
    model: gemini-3.8-flash-high
    base_url: http://sub2api:8080/v1
    key_env: SUB2API_API_KEY
    api_mode: chat_completions
    timeout: 90
    reasoning_effort: high
    fallback_chain:
      - provider: custom
        model: gpt-5.6-luna
        base_url: http://sub2api:8080/v1
        key_env: SUB2API_API_KEY
        api_mode: codex_responses
        timeout: 90
        reasoning_effort: medium

platforms:
  qqbot:
    enabled: true
    extra:
      dm_policy: pairing
      group_policy: allowlist
      group_allow_from: []
      markdown_support: false

platform_toolsets:
  qqbot:
    - web
    - vision
    - skills
    - todo

plugins:
  enabled:
    - smart_group_qq
  entries:
    smart_group_qq:
      llm:
        # The plugin may use Hermes' built-in vision task, whose concrete
        # Gemini/Luna routes are fixed above. Arbitrary model overrides remain denied.
        allow_task_override: true
      settings:
        status_model: deepseek-v4-flash-0731
        status_reasoning: low
        keyword_replies:
          - id: bot-help
            match: exact
            pattern: 机器人帮助
            reply: 请发送 /help 查看本群可用功能。
            enabled: true
        moderation:
          static_rules:
            - id: credential-pattern
              match: regex
              pattern: '(?i)\b(?:sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{16,})\b'
              notice: 检测到疑似凭据，消息未提交给机器人。请立即撤回并轮换相关凭据。
              enabled: true
          semantic:
            enabled: false
            timeout_seconds: 5
            min_confidence: 0.92
            notice: 此消息未能通过群聊安全审核。
        memory:
          window_size: 20
          idle_seconds: 1800
          summary_chars: 1200
          compact_after_messages: 12
          max_history_rows: 2000
          recent_context_messages: 12
        ambient:
          enabled: true
          analyze_images: true
          max_text_chars: 4000
        media_cache_roots:
          - /opt/data/cache
        knowledge:
          enabled: true
          allow_group_members_manage: true
          max_document_bytes: 5242880
          max_document_chars: 200000
          chunk_size: 900
          chunk_overlap: 120
          retrieval_limit: 5

terminal:
  backend: local

tool_loop_guardrails:
  non_interactive_hard_stop_enabled: true

updates:
  pre_update_backup: quick
  backup_keep: 5
  non_interactive_local_changes: stash
