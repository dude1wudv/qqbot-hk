_config_version: 13

timezone: Asia/Hong_Kong

gateway:
  group_sessions_per_user: false

quick_commands:
  low:
    type: alias
    target: /reasoning low --session
  medium:
    type: alias
    target: /reasoning medium --session
  high:
    type: alias
    target: /reasoning high --session
  xhigh:
    type: alias
    target: /reasoning xhigh --session
  max:
    type: alias
    target: /reasoning max --session
  deepseek:
    type: alias
    target: /model deepseek/deepseek-v4.1-flash --session
  gemini:
    type: alias
    target: /model gemini-3.8-flash-high --session
  mimo:
    type: alias
    target: /model xiaomi/mimo-v2.6-flash --session
  muse:
    type: alias
    target: /model meta/muse-spark-1.3-contributor --session

model:
  provider: sub2api_dialogue
  default: meta/muse-spark-1.3-contributor
  api_mode: chat_completions
  # Conservative application budget, not a claim about the upstream maximum.
  context_length: 131072
  streaming: true

compression:
  enabled: true
  threshold_tokens: 100000

providers:
  sub2api_deepseek:
    base_url: http://sub2api:8080/v1
    key_env: SUB2API_DEEPSEEK_API_KEY
    api_mode: chat_completions
    discover_models: false
    models:
      deepseek/deepseek-v4.1-flash:
        context_length: 1000000
  sub2api:
    base_url: http://sub2api:8080/v1
    key_env: SUB2API_API_KEY
    api_mode: chat_completions
    discover_models: false
    models:
      gemini-3.8-flash-high:
        context_length: 1048576
      gpt-5.6-luna:
        context_length: 330000
  sub2api_dialogue:
    base_url: http://sub2api:8080/v1
    key_env: SUB2API_DIALOGUE_API_KEY
    api_mode: chat_completions
    discover_models: false
    models:
      xiaomi/mimo-v2.6-flash:
        context_length: 131072
      meta/muse-spark-1.3-contributor:
        context_length: 131072


agent:
  reasoning_effort: low
  # Hermes passes attached images natively and translates them for the provider protocol.
  image_input_mode: native
  reasoning_overrides:
    deepseek/deepseek-v4.1-flash: medium
    gemini-3.8-flash-high: high
    gpt-5.6-luna: medium
    xiaomi/mimo-v2.6-flash: xhigh
    meta/muse-spark-1.3-contributor: low

auxiliary:
  compression:
    provider: custom
    model: deepseek/deepseek-v4.1-flash
    base_url: http://sub2api:8080/v1
    key_env: SUB2API_DEEPSEEK_API_KEY
    api_mode: chat_completions
    reasoning_effort: low

voice:
  auto_tts: false

platforms:
  qqbot:
    enabled: true
    extra:
      # Unknown DMs reach Hermes' pairing gate. The plugin may approve them only
      # during the explicit, expiring enrollment window below.
      dm_policy: pairing
      group_policy: allowlist
      # Both the QQ adapter and central gateway grant group-only access.
      # DM pairing remains independent; do not set QQ_ALLOW_ALL_USERS.
      group_allow_from: ["*"]
      group_allowed_chats: ["*"]
      # Keep native auto-compression; if its durable anti-thrash breaker trips,
      # rotate the affected QQ session before processing the next ordinary message.
      auto_new_on_compression_ineffective: true
      voice_input_enabled: false
      voice_output_enabled: false
      markdown_support: false
      stt:
        enabled: false

display:
  platforms:
    qqbot:
      streaming: false
      tool_progress: "off"
      interim_assistant_messages: false
      thinking_progress: false
      show_reasoning: false
      long_running_notifications: false
      busy_ack_detail: false

platform_toolsets:
  qqbot:
    - web
    - vision
    - skills
    - terminal
    - file
    - todo

plugins:
  enabled:
    - smart_group_qq
  entries:
    smart_group_qq:
      llm:
        # Structured plugin tasks may use the configured model routes.
        allow_task_override: true
      settings:
        character:
          enabled: true
          proactive_enabled: false
          # GitHub release discovery is disabled; normal @ and group replies remain available.
          think_interval_seconds: 900
          discovery_feeds: []
        status_model: meta/muse-spark-1.3-contributor
        status_reasoning: low
        auto_pair:
          enabled: true
          until_utc: "2026-09-05T08:00:00Z"
        keyword_replies:
          - id: bot-help
            match: exact
            pattern: 机器人帮助
            reply: 请发送 /help 查看本群可用功能。
            enabled: true
        moderation:
          static_rules:
            - id: credential-pattern
              match: regex
              pattern: '(?i)\b(?:sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]{16,})\b'
              notice: 检测到疑似凭据，消息未提交给机器人。请立即撤回并轮换相关凭据。
              enabled: true
          semantic:
            enabled: false
            timeout_seconds: 5
            min_confidence: 0.92
            notice: 此消息未能通过群聊安全审核。
        memory:
          window_size: 20
          idle_seconds: 1200
          summary_chars: 1200
          compact_after_messages: 40
          summary_min_interval_seconds: 300
          idle_min_pending_messages: 4
          summary_input_char_budget: 12000
          max_compaction_batches: 4
          max_history_rows: 2000
          recent_context_messages: 12
          context_char_budget: 4000
          context_section_chars:
            recent: 1600
            summary: 800
            member: 600
            knowledge: 1000
          ambient_retention_days: 7
          addressed_retention_days: 30
          audit_retention_days: 90
          claim_retention_days: 7
        ambient:
          enabled: true
          analyze_images: false
          max_text_chars: 4000
          queue_max_size: 2000
          per_group_concurrency: 1
          flush_interval_seconds: 30
          context_window_messages: 20
          context_window_seconds: 900
          participation:
            enabled: true
            cooldown_seconds: 0
            max_age_seconds: 120
            timeout_seconds: 12
            min_confidence: 0.55
            # 0 disables local frequency/retreat limits; platform quotas still apply.
            max_interjections_per_minute: 0
            unanswered_pause_seconds: 0
            # Tail debounce for consecutive messages from the same member.
            debounce_seconds: 2
            max_wait_seconds: 5
            # Bot-name calls are direct signals. Generic help phrases are scored separately.
            wake_words:
              - 小分队机器人
              - 小栖
              - 群助手
              - 小助手
              - 小分队
              - 机器人
              - 助手
              - qqbot
              - hermes
              - bot
        member_memory:
          enabled: true
          auto_extract: true
          extract_from_ambient: true
          min_confidence: 0.85
          fact_retention_days: 180
          max_profile_facts: 20
        media_cache_roots:
          - /opt/data/cache
        knowledge:
          enabled: true
          allow_group_members_manage: true
          max_document_bytes: 5242880
          max_document_chars: 200000
          chunk_size: 900
          chunk_overlap: 120
          retrieval_limit: 3

terminal:
  backend: local

tool_loop_guardrails:
  non_interactive_hard_stop_enabled: true

updates:
  pre_update_backup: quick
  backup_keep: 5
  non_interactive_local_changes: stash
