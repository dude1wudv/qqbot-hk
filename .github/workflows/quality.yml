name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Local unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements-ci.txt

      # Tests use temporary/in-memory data and fake adapters/LLMs, not a live bot.
      # Hermes image verification scripts need real upstream source and are separate.
      - name: Test local behavior
        run: python -m unittest discover -s tests -q

  image-compatibility:
    name: Fixed Hermes compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect runtime changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          if [ "$MANUAL" = true ] || [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" HEAD | grep -Eq '^(Dockerfile|runtime/|plugins/|hooks/|config/|overrides/|scripts/(patch-|verify-)|\.github/workflows/quality\.yml)'; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and verify pinned image
        if: steps.changes.outputs.build == 'true'
        run: docker build --progress=plain -t qqbot-hk/offline-compat:${{ github.sha }} .
