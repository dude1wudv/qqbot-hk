name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Local unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-ci.txt

      - name: Install test dependencies
        run: python -m pip install -r tests/requirements-ci.txt

      # Tests use temporary/in-memory data and fake adapters/LLMs, not a live bot.
      # Hermes image verification scripts need real upstream source and are separate.
      - name: Test local behavior
        run: python -m unittest discover -s tests -q
